<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Pastor David & Joy Wedding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <header class="bg-slate-900 text-white px-6 py-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded text-xs uppercase tracking-wider">Officials Portal</span>
            <h1 class="text-base font-semibold">Pastor David & Joy's Wedding Admin</h1>
        </div>
        <div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition text-slate-200">
                <i class="fa-solid fa-globe mr-1"></i> Public Site
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- Metrics -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-slate-500 text-xs font-medium uppercase">Total RSVP Responses</div>
                <div id="totalRsvpCount" class="text-3xl font-bold text-slate-900 mt-2">0</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-slate-500 text-xs font-medium uppercase">Confirmed Attending</div>
                <div id="attendingCount" class="text-3xl font-bold text-emerald-600 mt-2">0</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-slate-500 text-xs font-medium uppercase">Messages / Prayers Sent</div>
                <div id="messagesCount" class="text-3xl font-bold text-amber-600 mt-2">0</div>
            </div>
        </section>

        <!-- Table -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-slate-900">Cloud Guest RSVPs & Messages</h2>
                    <p class="text-xs text-slate-500">Live entries stored in Supabase database</p>
                </div>
                <button onclick="fetchAdminData()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate mr-1"></i> Refresh List
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-semibold uppercase">
                            <th class="py-3 px-4">Date / Time</th>
                            <th class="py-3 px-4">Guest Name</th>
                            <th class="py-3 px-4">Phone</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Prayer / Message</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="py-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading database records...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // --- SUPABASE CONFIGURATION ---
        // REPLACE THESE TWO STRINGS WITH YOUR SUPABASE DETAILS FROM STEP 1
        const SUPABASE_URL = 'https://ajgyfftvfgfetvgmlbkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqZ3lmZnR2ZmdmZXR2Z21sYmtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzg4NzUsImV4cCI6MjEwNzkxNDg3NX0.UA6PWIdsOqpgghAjaOrAahY3SoTppVPWRjn1BcyQvrY';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchAdminData() {
            const tbody = document.getElementById('adminTableBody');
            
            const { data, error } = await supabaseClient
                .from('rsvps')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-500">Error loading data: ${error.message}</td></tr>`;
                return;
            }

            document.getElementById('totalRsvpCount').innerText = data.length;
            document.getElementById('attendingCount').innerText = data.filter(i => i.status === 'Attending').length;
            document.getElementById('messagesCount').innerText = data.filter(i => i.message && i.message.trim().length > 0).length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">No RSVPs recorded in the database yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => {
                const dateStr = new Date(item.created_at).toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3 px-4 text-slate-400 font-mono text-[11px]">${dateStr}</td>
                        <td class="py-3 px-4 font-semibold text-slate-800">${escapeHtml(item.name)}</td>
                        <td class="py-3 px-4 text-slate-600">${escapeHtml(item.phone)}</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${item.status === 'Attending' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${item.status}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-slate-600 max-w-xs truncate">${item.message ? escapeHtml(item.message) : '<span class="text-slate-300">None</span>'}</td>
                    </tr>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>"']/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]; }) : '';
        }

        // Live Realtime listener (Auto updates table when someone submits on public site!)
        supabaseClient
            .channel('rsvps-changes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rsvps' }, payload => {
                fetchAdminData();
            })
            .subscribe();

        // Initial Load
        fetchAdminData();
    </script>
</body>
</html>
